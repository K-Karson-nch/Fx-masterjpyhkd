name: Update Mastercard rates

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mastercard-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest Mastercard rates
        run: npm run update-rates

      - name: Commit rate changes
        shell: bash
        run: |
          if git diff --quiet -- rates.json; then
            echo "No rate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git commit -m "Update Mastercard JPY/HKD rates"
          git push
